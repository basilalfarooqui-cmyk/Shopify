<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosha</title>

<!-- The store lives in /main-store/ because its stylesheets, scripts and
     photographs are addressed relative to that folder. Rather than duplicate
     the home page here and let the two drift apart, this sends visitors
     straight there.

     Three mechanisms, so it works with scripting disabled:
       1. the meta refresh fires immediately
       2. the script fires first in practice and replaces the history entry,
          so Back does not bounce the visitor into a redirect loop
       3. the visible link is there if both are blocked
-->
<meta http-equiv="refresh" content="0; url=main-store/index.html">
<link rel="canonical" href="main-store/index.html">
<script>location.replace('main-store/index.html');</script>

<style>
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:#faf7f2;color:#14110f;
    font:16px/1.6 system-ui,-apple-system,sans-serif;
    text-align:center;padding:24px;
  }
  a{color:#14110f}
  .sp{
    width:28px;height:28px;margin:0 auto 18px;border-radius:50%;
    border:2px solid rgba(20,17,15,.15);border-top-color:#14110f;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.sp{animation:none}}
</style>
</head>
<body>
  <div>
    <div class="sp" aria-hidden="true"></div>
    <p>Opening the store… <a href="main-store/index.html">continue</a></p>
  </div>
</body>
</html>
